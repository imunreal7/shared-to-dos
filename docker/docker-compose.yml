version: "3.8"

services:
    db:
        image: postgres
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: todo
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    backend:
        build:
            context: ..
            dockerfile: docker/Dockerfile.backend
        ports:
            - "3001:3001"
        environment:
            - DATABASE_URL=postgres://postgres:postgres@db:5432/todo
        depends_on:
            - db

volumes:
    pgdata:

